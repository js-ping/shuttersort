# 推 v* 标签 → 自动在真实 Windows 上打包 ShutterSort.exe 并挂到对应 Release；
# 也可以到 Actions 页面手动点 "Run workflow" 只打包不发布（产物在 Artifacts 里）。
#
# 注意：通过 API / 脚本改动本文件，token 必须带 `workflow` 权限，否则 GitHub 会
# 返回一个看不出原因的 404。用网页或本地 git push 改则不受此限制。

name: 打包 Windows 版

# 什么时候跑：
#   · 推一个 v* 标签（比如 v1.1.0）→ 自动打包并把 exe 挂到对应的 Release 上
#   · 在 Actions 页面手动点 "Run workflow" → 只打包，产出在 Artifacts 里
#   · 改动了源码并推到 main → 只跑自检 + 打包，确认没坏
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 挂 Release 资产需要写权限

# 让 Python 全程用 UTF-8，避免中文日志在英文版 runner 上炸掉。
# 脚本里也各自做了兜底，这里是双保险。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: 构建 ShutterSort.exe
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet

      - name: 跑自检（49 项）
        run: python tests/selftest.py

      - name: 生成 Windows 图标
        run: python packaging/make_ico.py

      - name: 打包成单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean
          --windowed --onefile
          --name ShutterSort
          --icon packaging/icons/app.ico
          --version-file packaging/version_info.txt
          --add-data "src/static;static"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import clr
          src/app_main.py

      - name: 确认产物存在
        run: |
          Get-Item dist/ShutterSort.exe | Format-List Name, Length
          if (-not (Test-Path dist/ShutterSort.exe)) { exit 1 }

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: ShutterSort-windows
          path: dist/ShutterSort.exe
          if-no-files-found: error

      - name: 挂到 Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShutterSort.exe
          # 发布说明单独放在 packaging/ci/RELEASE_NOTES.md，一次只维护一份。
          # 发新版本前记得先把它改成当版的内容。
          body_path: packaging/ci/RELEASE_NOTES.md

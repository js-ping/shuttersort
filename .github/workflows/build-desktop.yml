# 推 v* 标签 → 在真实 macOS 机器上打一份，挂到对应 Release；
# 也可以到 Actions 页面手动点 "Run workflow" 只打包不发布（产物在 Artifacts 里）。
#
# 从 v1.8.0 起本项目只做 macOS 原生版，Windows / Linux 已移除。
# 只剩一个 job，不需要再协调多平台产物，发布这一步直接并入 macos job。
#
# 两个踩过的坑，改这个文件前先看一眼：
#
# 1) 通过 API / 脚本改动本文件，token 必须带 `workflow` 权限，否则 GitHub 会返回
#    一个看不出原因的 404。用网页或本地 git push 改则不受此限制。
#
# 2) 用 Git Data API 的 `PATCH /git/refs/heads/main` 更新引用 **不会** 触发本工作流 ——
#    GitHub 不把它算作 push 事件（仓库的 pushed_at 也不会变），结果就是改了没反应。
#    必须走真正的 git push，或者用 Contents API / 网页编辑。

name: 打包 macOS 版

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 挂 Release 资产需要写权限

# 让测试脚本里的中文日志在英文版 runner 上也不炸
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:

  macos:
    name: 构建 ShutterSort.app（原生 SwiftUI）
    runs-on: macos-14          # Apple 芯片；这里交叉编出 arm64 + x86_64 通用二进制

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 看一眼工具链
        run: |
          swift --version
          xcodebuild -version || true
          python3 --version
          echo "版本号：$(cat VERSION)"

      - name: 逐字段对照（14 个场景）
        working-directory: native
        # 这是发布前最重要的一道闸：解析器是 Swift 重写的，只有和参考实现逐字段零差异才敢发。
        # 任何一处不一致都会让这个 job 失败，后面打包和发布都不会跑。
        run: python3 tests/run_parity.py

      - name: 改名规则自检（38 项边界）
        working-directory: native
        # 「按位置增删」最怕数错一位 —— 界面里看着像对的，改完一百张才发现每张少两个字。
        # 这里把 0 / 负数 / 超长 / 锚点找不到 / 叠加 / 停用 / 中文 / 扩展名保护全钉成断言。
        run: |
          set -eux
          swiftc -O Sources/Core/*.swift Sources/CLI/main.swift -o "$RUNNER_TEMP/ss-cli"
          "$RUNNER_TEMP/ss-cli" edit-test

      - name: 编译原生版 + 打 zip / dmg
        working-directory: native
        run: |
          set -eux
          chmod +x build.sh
          ./build.sh --universal --zip --dmg
          ls -lh dist/

      - name: 冒烟测试（能启动并报出版本与架构）
        working-directory: native
        run: |
          set -eux
          ./dist/ShutterSort.app/Contents/MacOS/ShutterSort --version
          lipo -archs dist/ShutterSort.app/Contents/MacOS/ShutterSort

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShutterSort-macos
          path: |
            native/dist/*.dmg
            native/dist/*.zip
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/dist/*.dmg
            native/dist/*.zip
          # 发布说明单独放在 .github/RELEASE_NOTES.md，一次只维护一份。
          # 发新版本前记得先把它改成当版的内容。
          body_path: .github/RELEASE_NOTES.md

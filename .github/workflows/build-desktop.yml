# 推 v* 标签 → 在真实的 Windows 和 macOS 机器上各打一份，统一挂到对应 Release；
# 也可以到 Actions 页面手动点 "Run workflow" 只打包不发布（产物在 Artifacts 里）。
#
# 两个踩过的坑，改这个文件前先看一眼：
#
# 1) 通过 API / 脚本改动本文件，token 必须带 `workflow` 权限，否则 GitHub 会返回
#    一个看不出原因的 404。用网页或本地 git push 改则不受此限制。
#
# 2) 用 Git Data API 的 `PATCH /git/refs/heads/main` 更新引用 **不会** 触发本工作流 ——
#    GitHub 不把它算作 push 事件（仓库的 pushed_at 也不会变），结果就是改了没反应。
#    必须走真正的 git push，或者用 Contents API / 网页编辑。

name: 打包桌面版

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 挂 Release 资产需要写权限

# 让 Python 全程用 UTF-8，避免中文日志在英文版 runner 上炸掉（脚本里也各自兜底了）
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:

  # ---------------------------------------------------------------- Windows
  windows:
    name: 构建 ShutterSort.exe
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet

      - name: 跑自检（65 项）
        run: python tests/selftest.py

      - name: 生成 Windows 图标
        run: python packaging/make_ico.py

      - name: 打包成单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean
          --windowed --onefile
          --name ShutterSort
          --icon packaging/icons/app.ico
          --version-file packaging/version_info.txt
          --add-data "src/static;static"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import clr
          src/app_main.py

      - name: 确认产物存在
        run: |
          Get-Item dist/ShutterSort.exe | Format-List Name, Length
          if (-not (Test-Path dist/ShutterSort.exe)) { exit 1 }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShutterSort-windows
          path: dist/ShutterSort.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- macOS
  macos:
    name: 构建 ShutterSort.app
    runs-on: macos-14          # Apple 芯片，产出的就是 arm64

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview

      - name: 跑自检（65 项）
        run: python tests/selftest.py

      - name: 打包 .app + dmg
        working-directory: packaging
        # 直接调用打包脚本，不再在 CI 里另抄一份 PyInstaller 参数 ——
        # 抄一份的后果已经踩过：本地把版本号写进了 Info.plist，CI 那份没跟着改，
        # 发出去的 .app 版本依然是 0.0.0。单一真相源。
        # 脚本末尾有个 read -n 1（给人按任意键的），喂个回车让它过。
        run: |
          set -eux
          export SHUTTERSORT_PY="$(command -v python)"
          chmod +x build_app.command
          printf '\n' | ./build_app.command
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShutterSort-macos
          path: |
            packaging/dist/ShutterSort-macOS-arm64.dmg
            packaging/dist/ShutterSort-macOS-arm64.zip
          if-no-files-found: error

  # --------------------------------------------------------------- 发布
  # 单独的 job，等两个平台都打好了再一次性挂上去。
  # 否则两个 job 同时去建同一个 Release 会互相打架。
  release:
    name: 挂到 Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码（发布说明要用）
        uses: actions/checkout@v4

      - name: 取回两个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 看一眼拿到的文件
        run: find artifacts -type f -exec ls -lh {} \;

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ShutterSort-windows/ShutterSort.exe
            artifacts/ShutterSort-macos/ShutterSort-macOS-arm64.dmg
            artifacts/ShutterSort-macos/ShutterSort-macOS-arm64.zip
          # 发布说明单独放在 packaging/ci/RELEASE_NOTES.md，一次只维护一份。
          # 发新版本前记得先把它改成当版的内容。
          body_path: packaging/ci/RELEASE_NOTES.md
